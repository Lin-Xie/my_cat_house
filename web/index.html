</div></main>
<svg id="guideShade" aria-hidden="true" hidden><defs><mask id="guideWindows"><rect width="100%" height="100%" fill="white"/><g id="guideHoles" fill="black"></g></mask></defs><rect width="100%" height="100%" fill="#22271e" opacity=".58" mask="url(#guideWindows)"/></svg>
<dialog id="adoption" aria-labelledby="adoptTitle"><form id="adoptForm">
  <div class="adoptPortrait"><svg aria-hidden="true"><use href="#avatar-cat"/></svg></div>
  <h2 id="adoptTitle">领养你的橘猫</h2><p>给它起个名字，一起回家。教程会从摸摸它开始，带你一步步熟悉小屋。</p>
  <label>给猫咪起个名字<input id="adoptName" value="橘子" maxlength="16" required autocomplete="off"></label>
  <label class="check"><input type="checkbox" id="adoptLetters">开启自主日记和回访来信</label>
  <div class="actions"><button type="submit" value="learn">领养并开始教程</button><button type="submit" value="skip">领养，暂时跳过教程</button></div>
  <small>之后可从页面顶部的「使用教程」继续学习。</small>
</form></dialog>
<dialog id="diary" class="journal" aria-labelledby="diaryTitle">
  <div class="journalHead"><div class="dialogTitle"><svg class="dialogMark" aria-hidden="true"><use href="#ui-book"/></svg><h2 id="diaryTitle">猫咪的日记</h2></div><button class="close" aria-label="合上日记">×</button></div>
  <article class="diaryPage"><p id="diaryDate"></p><h3 id="pageTitle"></h3><p id="pageBody"></p><p id="signature"></p></article>
  <div class="pageFoot"><button id="openRecords" aria-haspopup="dialog">管理记录</button><div><button id="older" aria-label="上一篇日记">‹</button> <button id="newer" aria-label="下一篇日记">›</button></div></div>
</dialog>
<dialog id="moments" aria-labelledby="momentsTitle"><div class="journalHead"><div class="dialogTitle"><svg class="dialogMark" aria-hidden="true"><use href="#ui-frame"/></svg><h2 id="momentsTitle">相伴足迹</h2></div><button class="close" aria-label="合上相伴足迹">×</button></div><ol id="timeline"></ol></dialog>
<dialog id="records" aria-labelledby="recordsTitle"><div class="journalHead"><div class="dialogTitle"><svg class="dialogMark" aria-hidden="true"><use href="#ui-book"/></svg><h2 id="recordsTitle">管理小屋记录</h2></div><button class="close" aria-label="关闭记录管理">×</button></div><ul id="entries"></ul></dialog>
<dialog id="config" aria-labelledby="configTitle"><form><div class="dialogTitle"><svg class="dialogMark" aria-hidden="true"><use href="#ui-settings"/></svg><h2 id="configTitle">设置与隐私</h2></div><p id="modelState"></p><label>API 基础地址<input id="base" type="url" placeholder="https://你的服务地址/v1" required></label><label id="presetLabel" hidden>DeepSeek 模型<select id="preset"><option value="deepseek-flash">DeepSeek Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option><option value="">自定义模型</option></select></label><label id="modelLabel">模型名称<input id="model" required></label><label>API Key<input id="key" type="password" autocomplete="off" required></label><label class="check"><input id="remember" type="checkbox">在此浏览器记住密钥</label><p class="hint">聊天记录自动保存在此浏览器，续聊时会把近期对话和相关的已收录回忆发给所选模型。勾选记住密钥后，密钥以明文保存在本机浏览器。</p><button type="button" id="testConnection">测试连接</button><p id="cfgStatus" role="status"></p><div class="actions"><button type="button" id="forget">清除配置</button><button type="button" class="close">取消</button><button type="submit">保存</button></div></form><details class="dataTools"><summary>本机数据</summary><div><button id="exportData">导出小屋数据</button><button id="clearData">清除本机数据</button></div></details></dialog>
<dialog id="profile" aria-labelledby="profileTitle"><form><div class="dialogTitle"><svg class="dialogMark" aria-hidden="true"><use href="#avatar-cat"/></svg><h2 id="profileTitle">猫咪档案</h2></div><label>名字<input id="catName" maxlength="16" required></label><p id="traits"></p>
<dl class="profileStats">
  <div><dt>心情</dt><dd id="profileMood"></dd></div>
  <div><dt>亲密度</dt><dd id="profileBond"></dd><dd class="statDetail" id="bondScore"></dd></div>
  <div><dt>成长体重</dt><dd id="profileWeight"></dd><dd class="statDetail" id="weightChange"></dd></div>
</dl>
<label class="check"><input id="semantic" type="checkbox">允许模型在已收录回忆中按含义查找（最多 32 条摘录）</label><label class="check"><input id="proactive" type="checkbox">开启自主日记和回访来信（有密钥时由模型续聊）</label><label class="check"><input id="sound" type="checkbox">连续抚摸时播放呼噜声</label><div class="hours"><label>安静开始<input type="time" id="quietStart" required></label><label>安静结束<input type="time" id="quietEnd" required></label></div><div class="actions"><button class="close" type="button">取消</button><button type="submit">保存档案</button></div></form></dialog>
<dialog id="garden" aria-labelledby="gardenTitle"><div class="journalHead"><div class="dialogTitle"><svg class="dialogMark" aria-hidden="true"><use href="#ui-pot"/></svg><h2 id="gardenTitle">书架上的盆栽</h2></div><button class="close" aria-label="合上花盆">×</button></div>
<form id="sow"><label>种子<select id="seedKind"></select></label><label>给植物取个名字<input id="plantName" maxlength="16" required placeholder="比如：小满"></label><div class="actions"><button type="button" id="cancelSow" hidden>留下这盆</button><button type="submit">一起种下</button></div></form>
<div id="plantCare" hidden><p id="plantInfo"></p>
  <div class="growthMeter"><label for="plantProgress">成熟进度</label><span id="growthPercent" aria-hidden="true"></span><progress id="plantProgress" max="100" value="0"></progress></div>
